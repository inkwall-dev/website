# Builds and checks the site on every pull request and push to main, then
# deploys it to Cloudflare Pages: a preview for pull requests, production
# (inkwall.dev) for main.
name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production deploy halfway; superseded previews can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # What ships: the site's own dependencies, not the build tooling.
      - run: npm audit --omit=dev --audit-level=high
      # Type checks (astro check), then builds into dist/.
      - run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal links and #anchors in the built site; external links
          # are not checked, so a third-party outage can't fail a build.
          args: >-
            --offline
            --include-fragments
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    needs: build
    # Pull requests from forks get no secrets: they are built and checked,
    # not deployed.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      # Branch names become the preview's alias; keep them to safe
      # characters before they reach a command line.
      - id: branch
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: echo "name=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9-' '-' | cut -c1-28)" >> "$GITHUB_OUTPUT"
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: pages deploy dist --project-name=inkwall-website --branch=${{ steps.branch.outputs.name }} --commit-hash=${{ github.sha }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview of ${SHA:0:7}: ${URL}"
          if [ -n "$ALIAS" ]; then body="$body (latest for this branch: ${ALIAS})"; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "$body"
