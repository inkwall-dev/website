# Builds and checks the site on every pull request and push to main.
# Cloudflare Pages, connected to the repository, deploys it: a preview for
# pull requests, production (website.inkwall.dev) for main.
name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # What ships: the site's own dependencies, not the build tooling.
      - run: npm audit --omit=dev --audit-level=high
      # Type checks (astro check), then builds into dist/.
      - run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal links and #anchors in the built site; external links
          # are not checked, so a third-party outage can't fail a build.
          args: >-
            --offline
            --include-fragments
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true
