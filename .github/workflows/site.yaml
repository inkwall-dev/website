# Builds and checks the site on every pull request and push to main.
# Cloudflare Pages, connected to the repository, deploys it: a preview for
# pull requests, production (website.inkwall.dev) for main.
name: site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # What ships: the site's own dependencies, not the build tooling. Fails
      # on any high or critical advisory but GHSA-fc5q-39xc-vjpf (picomatch
      # ReDoS through repeated extglobs, no patched version yet): picomatch
      # runs only at build time, on the site's own glob patterns. Drop the
      # exception once picomatch has a fix.
      - run: |
          npm audit --omit=dev --json > audit.json || true
          jq -r '[.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical") | .url] | unique | .[]' audit.json > high.txt
          grep -vxF https://github.com/advisories/GHSA-fc5q-39xc-vjpf high.txt > blocking.txt || true
          if [ -s blocking.txt ]; then
            echo "::error::high or critical advisories:"; cat blocking.txt; exit 1
          fi
      # Type checks (astro check), then builds into dist/.
      - run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Internal links and #anchors in the built site; external links
          # are not checked, so a third-party outage can't fail a build.
          args: >-
            --offline
            --include-fragments
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true
